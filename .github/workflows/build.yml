# meticulous and honest
name: VoidsMood CI — Build Universal Release APK (R8 Optimized)

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Universal Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate Release Keystore
        shell: bash
        run: |
          mkdir -p app/keystore
          if [ ! -f app/keystore/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/keystore/release.keystore \
              -alias voidsmood \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass voidsmood123 \
              -keypass voidsmood123 \
              -dname "CN=VoidsMood, OU=VoidsMood, O=VoidsMood, L=Cikarang, ST=WestJava, C=ID"
          fi

      - name: Build High-Performance Universal Release APK with R8
        shell: bash
        run: |
          chmod +x ./gradlew
          # BARU: Gunakan --no-daemon agar proses build tidak terputus di runner GitHub Actions
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          STORE_PASSWORD: voidsmood123
          KEY_ALIAS: voidsmood
          KEY_PASSWORD: voidsmood123

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidsMood-Universal-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Send Telegram Notification with Release APK
        shell: bash
        run: |
          python3 -c "
          import os, glob, urllib.request, json

          BOT_TOKEN = '9028857744:AAH6mbej_PCv7FO5DaC5PH9QfDHnnJ1fGwg'
          CHAT_ID = 7653237470

          apk_files = glob.glob('app/build/outputs/apk/release/*.apk')
          if not apk_files:
              text = '❌ <b>VoidsMood CI:</b> Build Release gagal menemukan file APK!'
              req = urllib.request.Request(
                  f'https://api.telegram.org/bot{BOT_TOKEN}/sendMessage',
                  data=json.dumps({'chat_id': CHAT_ID, 'text': text, 'parse_mode': 'HTML'}).encode(),
                  headers={'Content-Type': 'application/json'}
              )
              urllib.request.urlopen(req)
              exit(0)

          target_apk = apk_files[0]
          size_mb = os.path.getsize(target_apk) / (1024 * 1024)
          caption = (
              f'🚀 <b>VoidsMood — Universal Release APK Siap!</b>\n\n'
              f'📱 <b>Target Perangkat:</b> Infinix Smart 9 HD (armv7) & Universal\n'
              f'⚡ <b>Optimasi:</b> Full R8 Code Shrinking & Resource Minification\n'
              f'🎨 <b>Desain:</b> Glassmorphism 35% & Auramorphism (Charcoal-Ocean)\n'
              f'📦 <b>Ukuran APK:</b> {size_mb:.2f} MB\n'
              f'🔗 <b>Commit:</b> <code>${{ github.sha }}</code>'
          )

          boundary = '----WebKitFormBoundaryVoidsMood'
          body = bytearray()
          body.extend(f'--{boundary}\r\nContent-Disposition: form-data; name=\"chat_id\"\r\n\r\n{CHAT_ID}\r\n'.encode())
          body.extend(f'--{boundary}\r\nContent-Disposition: form-data; name=\"caption\"\r\n\r\n{caption}\r\n'.encode())
          body.extend(f'--{boundary}\r\nContent-Disposition: form-data; name=\"parse_mode\"\r\n\r\nHTML\r\n'.encode())
          filename = os.path.basename(target_apk)
          body.extend(f'--{boundary}\r\nContent-Disposition: form-data; name=\"document\"; filename=\"{filename}\"\r\nContent-Type: application/vnd.android.package-archive\r\n\r\n'.encode())
          with open(target_apk, 'rb') as f:
              body.extend(f.read())
          body.extend(f'\r\n--{boundary}--\r\n'.encode())

          req = urllib.request.Request(
              f'https://api.telegram.org/bot{BOT_TOKEN}/sendDocument',
              data=bytes(body),
              headers={'Content-Type': f'multipart/form-data; boundary={boundary}'}
          )
          with urllib.request.urlopen(req, timeout=120) as resp:
              print('APK successfully sent to Telegram:', resp.status)
          "
