# meticulous and honest
# JVM and memory settings for GitHub Actions runners and R8 optimization
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Djava.awt.headless=true -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx2048M -Djava.awt.headless=true
android.useAndroidX=true
android.enableJetifier=false
org.gradle.parallel=true
org.gradle.daemon=false
org.gradle.configuration-cache=false
android.nonTransitiveRClass=true

# BARU: Timeout JitPack untuk kelancaran download NewPipeExtractor di CI
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
